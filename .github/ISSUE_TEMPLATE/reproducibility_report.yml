name: Reproducibility report
description: Share what a reproducibility check on your GPU showed — the same bits as the reference PC, or not.
title: "[Reproducibility] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for running a check on your GPU. Every result helps — especially from AMD, Intel and other non-NVIDIA cards, and
        results that are **not** the same. English or Korean is fine.

        In the app, open **Benchmark** (벤치마크) and run **Reproducibility check** (재현성 검증) or **File-pair reproducibility**
        (파일 쌍 재현성). When it finishes, press **Export zip** (zip 내보내기) and attach that zip below. It holds `summary.json`
        (what matched) and `environment.json` (GeulPU version and commit, GPU, driver and OS), with user paths removed.

        A crash or a wrong answer outside these checks belongs in a **Bug report** instead.
  - type: dropdown
    id: check
    attributes:
      label: Which check
      options:
        - Reproducibility check (DeepSeek-R1-Distill-Qwen-7B Q8_0)
        - File-pair reproducibility (the Liu · Tsai GGUF files)
        - Something else (describe below)
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Full run or quick check
      description: A quick check runs only a few problems and is not a full check.
      options:
        - Full run
        - Quick check
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      description: As shown on the result card.
      options:
        - All problems give the same output as the reference PC
        - Some problems give a different output from the reference PC
        - The run failed or stopped
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GeulPU version
      description: Shown at the bottom right of the app, or run `geulpu --version`.
      placeholder: "0.12.0"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU, driver and backend
      description: The GPU and its memory, the driver version, and the backend shown on the **Hardware** page (CUDA or Vulkan).
      placeholder: "AMD Radeon RX 9060 XT 16 GB, driver <version>, Vulkan"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"
  - type: textarea
    id: numbers
    attributes:
      label: Numbers from the result
      description: >-
        How many problems matched for each path or file (for example `32/32`). For any that differ, the first differing step from
        `summary.json`. Files you could not run (not enough graphics memory, for example) are useful to know too.
      placeholder: |
        default 32/32, ffpoff 32/32, imatrix 32/32, 7b-q4km 32/32
        7b-q8_0 not run — 8 GB card
    validations:
      required: true
  - type: textarea
    id: zip
    attributes:
      label: Exported result zip
      description: >-
        Drag the zip from **Export zip** here (GitHub accepts files up to 25 MB). If it is larger, attach `summary.json` and
        `environment.json` from the result's folder in `%USERPROFILE%\GeulPU\결과\` instead.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Error messages, how long the first load took, other programs using the GPU at the same time, or anything unusual.
