# GeulPU 빠른 점검 — GPU · 모델 파일 없이 커밋마다(시험/빠른점검.py). 글(geul) 컴파일러는 CPU 프로그램이라 커널 소스 → PTX 까지는
# GPU 없이 만들 수 있다: 글 컴파일러를 글 저장소의 고정 판(시험/글저장소커밋.txt — 글 1.4.0)에서 빌드하고, 이 저장소의 PTX · SPIR-V
# 백엔드(백엔드/) · 생성기 · 호스트 프로그램을 빌드하고, 모듈을 처음부터 만들어(소스 · PTX · SPIR-V 묶음 — 31단계) 시험/모듈해시.txt 와
# 바이트까지 견준다. 그다음 NVIDIA ptxas(검사에만 — 엔진은 쓰지 않는다)로
# PTX → SASS(sm_89)까지 — 커널마다 레지스터 · 넘침(spill)을 적는다. GPU 의 비트 대조 · 속도는 단계마다의 공식 실행(공식실행/)이 한다.
# GeulPUv2 0.6.0 뒤 — 모듈은 커널/ · 백엔드/ · 시험/모듈해시.txt · 시험/SASS넘침.txt · 시험/글저장소커밋.txt(와 이 점검 · 이 파일)로만 정해진다. 그것들이
# 앞 커밋과 같으면 모듈 · SASS(6 ~ 8 분)를 건너뛰고(빠른점검 --모듈없이 — 문법 · 계약 · 빌드 · 가져오기 표는 늘), 하나라도 바뀌면 모두 본다.
# main 은 풀 리퀘스트(pull request)로만 바뀐다(CONTRIBUTING.md) — 작업 브랜치는 풀 리퀘스트에서 한 번, main 은 병합(merge)된 뒤 한 번 돈다.
# 같은 풀 리퀘스트에 새로 푸시하면 앞 실행은 취소된다.
name: 빠른 점검
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: GeulPU 받기
        uses: actions/checkout@v7
        with:
          path: GeulPUv2
          fetch-depth: 0
      - name: 커널이 바뀌었나(아니면 모듈 · SASS 를 건너뜀)
        id: kernel
        working-directory: GeulPUv2
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from="${BASE:-$BEFORE}"
          paths="커널 백엔드 엔진/파일.gl 엔진/리눅스/파일.gl 시험/모듈해시.txt 시험/SASS넘침.txt 시험/글저장소커밋.txt 시험/빠른점검.py .github/workflows/ci.yml"
          if [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            echo "full=1" >> "$GITHUB_OUTPUT"; echo "견줄 앞 커밋이 없다 — 모두 본다"
          elif git diff --quiet "$from" HEAD -- $paths; then
            echo "full=0" >> "$GITHUB_OUTPUT"; echo "커널 · 생성기 · 글 고정 커밋 · 점검이 그대로 — 모듈 · SASS 를 건너뜀"
          else
            echo "full=1" >> "$GITHUB_OUTPUT"; echo "바뀐 곳:"; git diff --name-only "$from" HEAD -- $paths
          fi
      - name: 글 저장소의 고정 커밋 읽기
        id: geul
        run: echo "sha=$(tr -d '\r\n ' < GeulPUv2/시험/글저장소커밋.txt)" >> "$GITHUB_OUTPUT"
      - name: 글 저장소 받기(고정 판 — 시험/글저장소커밋.txt)
        uses: actions/checkout@v7
        with:
          repository: wwoosshh/geul-lang
          ref: ${{ steps.geul.outputs.sha }}
          path: geul-lang-v2
      - name: 파이썬
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 파이썬 꾸러미(+ 검사용 ptxas — 모듈을 볼 때만)
        run: |
          python -m pip install -r GeulPUv2/requirements.txt
          if [ "${{ steps.kernel.outputs.full }}" = "1" ]; then
            python -m pip install nvidia-cuda-nvcc-cu12==12.9.86
            python -c "import importlib.util, os; p = importlib.util.find_spec('nvidia.cuda_nvcc').submodule_search_locations[0]; print(os.path.join(p, 'bin', 'ptxas.exe'))" > ptxas경로.txt
            cat ptxas경로.txt
          fi
      - name: 글 컴파일러 캐시
        id: cache
        uses: actions/cache@v6
        with:
          path: geul-lang-v2/build/self_컴파일러.exe
          key: geul-compiler-${{ steps.geul.outputs.sha }}
      - name: 글 컴파일러 빌드(파이썬 참조 구현 → 글로 쓴 컴파일러 — 백엔드 둘은 빠른 점검이 백엔드/ 에서 빌드한다)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: geul-lang-v2
        env:
          PYTHONUTF8: "1"
        run: |
          mkdir -p build
          GEUL_ROOT=. python ref/geulc.py self/컴파일러.gl -o build/self_컴파일러.exe
      - name: llama.cpp 의 어휘 시험 파일 캐시
        uses: actions/cache@v6
        with:
          path: llama-vocab
          key: llama-vocab-${{ hashFiles('GeulPUv2/시험/어휘시험.txt') }}
      - name: llama.cpp 의 어휘 시험 파일 받기(시험/어휘시험.txt — 판 · 바이트 · sha256 고정)
        run: python -I -X utf8 GeulPUv2/시험/어휘받기.py llama-vocab
      - name: 빠른 점검
        working-directory: GeulPUv2
        env:
          PYTHONUTF8: "1"
        run: |
          if [ "${{ steps.kernel.outputs.full }}" = "1" ]; then
            python -X utf8 시험/빠른점검.py --글 ../geul-lang-v2 --출력 점검결과 --어휘 ../llama-vocab --ptxas "$(cat ../ptxas경로.txt)"
          else
            python -X utf8 시험/빠른점검.py --글 ../geul-lang-v2 --출력 점검결과 --어휘 ../llama-vocab --모듈없이
          fi
      - name: 점검 결과 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-result
          path: GeulPUv2/점검결과/*.txt
          if-no-files-found: ignore

  linux:
    # 29단계 — 리눅스(글 D-50): 같은 고정 판의 글 컴파일러를 리눅스에서 만들고(ELF), 백엔드 둘 · 생성기 · 호스트 프로그램을 빌드하고,
    # 모듈을 처음부터 만들어 윈도와 같은 시험/모듈해시.txt 와 바이트까지 견준다. 가져오기는 libc.so.6 · libcuda.so.1 뿐이어야 한다.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: GeulPU 받기
        uses: actions/checkout@v7
        with:
          path: GeulPUv2
          fetch-depth: 0
      - name: 커널이 바뀌었나(아니면 모듈 · SASS 를 건너뜀)
        id: kernel
        working-directory: GeulPUv2
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from="${BASE:-$BEFORE}"
          paths="커널 백엔드 엔진/파일.gl 엔진/리눅스/파일.gl 시험/모듈해시.txt 시험/SASS넘침.txt 시험/글저장소커밋.txt 시험/빠른점검.py .github/workflows/ci.yml"
          if [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            echo "full=1" >> "$GITHUB_OUTPUT"; echo "견줄 앞 커밋이 없다 — 모두 본다"
          elif git diff --quiet "$from" HEAD -- $paths; then
            echo "full=0" >> "$GITHUB_OUTPUT"; echo "커널 · 생성기 · 글 고정 커밋 · 점검이 그대로 — 모듈 · SASS 를 건너뜀"
          else
            echo "full=1" >> "$GITHUB_OUTPUT"; echo "바뀐 곳:"; git diff --name-only "$from" HEAD -- $paths
          fi
      - name: 글 저장소의 고정 커밋 읽기
        id: geul
        run: echo "sha=$(tr -d '\r\n ' < GeulPUv2/시험/글저장소커밋.txt)" >> "$GITHUB_OUTPUT"
      - name: 글 저장소 받기(고정 판 — 시험/글저장소커밋.txt)
        uses: actions/checkout@v7
        with:
          repository: wwoosshh/geul-lang
          ref: ${{ steps.geul.outputs.sha }}
          path: geul-lang-v2
      - name: 파이썬
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 파이썬 꾸러미(+ 검사용 ptxas — 모듈을 볼 때만)
        run: |
          python -m pip install -r GeulPUv2/requirements.txt
          if [ "${{ steps.kernel.outputs.full }}" = "1" ]; then
            python -m pip install nvidia-cuda-nvcc-cu12==12.9.86
            python -c "import importlib.util, os; p = importlib.util.find_spec('nvidia.cuda_nvcc').submodule_search_locations[0]; print(os.path.join(p, 'bin', 'ptxas'))" > ptxas경로.txt
            cat ptxas경로.txt
          fi
      - name: 글 컴파일러 빌드(파이썬 참조 구현 → 글로 쓴 컴파일러(ELF) — 백엔드 둘은 빠른 점검이 백엔드/ 에서 빌드한다)
        working-directory: geul-lang-v2
        env:
          PYTHONUTF8: "1"
        run: |
          mkdir -p build
          GEUL_ROOT=. python ref/geulc.py self/컴파일러.gl -o build/self_컴파일러
      - name: llama.cpp 의 어휘 시험 파일 캐시
        uses: actions/cache@v6
        with:
          path: llama-vocab
          key: llama-vocab-${{ hashFiles('GeulPUv2/시험/어휘시험.txt') }}
      - name: llama.cpp 의 어휘 시험 파일 받기(시험/어휘시험.txt — 판 · 바이트 · sha256 고정)
        run: python -I -X utf8 GeulPUv2/시험/어휘받기.py llama-vocab
      - name: 빠른 점검(리눅스)
        working-directory: GeulPUv2
        env:
          PYTHONUTF8: "1"
        run: |
          if [ "${{ steps.kernel.outputs.full }}" = "1" ]; then
            python -X utf8 시험/빠른점검.py --글 ../geul-lang-v2 --출력 점검결과 --어휘 ../llama-vocab --ptxas "$(cat ../ptxas경로.txt)"
          else
            python -X utf8 시험/빠른점검.py --글 ../geul-lang-v2 --출력 점검결과 --어휘 ../llama-vocab --모듈없이
          fi
      - name: 점검 결과 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-result-linux
          path: GeulPUv2/점검결과/*.txt
          if-no-files-found: ignore
