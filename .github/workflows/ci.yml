# GeulPU 빠른 점검 — GPU · 모델 파일 없이 커밋마다(시험/빠른점검.py). 글(geul) 컴파일러는 CPU 프로그램이라 커널 소스 → PTX 까지는
# GPU 없이 만들 수 있다: 글 컴파일러 · PTX 뒷단을 글 저장소의 고정 커밋(시험/글저장소커밋.txt)에서 빌드하고, 생성기 · 호스트 프로그램을
# 빌드하고, 모듈을 처음부터 만들어(소스 · PTX · SPIR-V 묶음 — 31단계) 시험/모듈해시.txt 와 바이트까지 견준다. 그다음 NVIDIA ptxas(검사에만 — 엔진은 쓰지 않는다)로
# PTX → SASS(sm_89)까지 — 커널마다 레지스터 · 넘침(spill)을 적는다. GPU 의 비트 대조 · 속도는 단계마다의 공식 실행(공식실행/)이 한다.
name: 빠른 점검
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: GeulPU 받기
        uses: actions/checkout@v7
        with:
          path: GeulPUv2
      - name: 글 저장소의 고정 커밋 읽기
        id: geul
        run: echo "sha=$(tr -d '\r\n ' < GeulPUv2/시험/글저장소커밋.txt)" >> "$GITHUB_OUTPUT"
      - name: 글 저장소 받기(research/gpu 의 고정 커밋)
        uses: actions/checkout@v7
        with:
          repository: wwoosshh/geul-lang
          ref: ${{ steps.geul.outputs.sha }}
          path: geul-lang-v2
      - name: 파이썬
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 파이썬 꾸러미(+ 검사용 ptxas)
        run: |
          python -m pip install -r GeulPUv2/requirements.txt nvidia-cuda-nvcc-cu12==12.9.86
          python -c "import importlib.util, os; p = importlib.util.find_spec('nvidia.cuda_nvcc').submodule_search_locations[0]; print(os.path.join(p, 'bin', 'ptxas.exe'))" > ptxas경로.txt
          cat ptxas경로.txt
      - name: 글 컴파일러 · PTX 뒷단 캐시
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            geul-lang-v2/build/self_컴파일러.exe
            geul-lang-v2/build/자체PTX.exe
            geul-lang-v2/build/자체SPIRV.exe
          key: geul-tools-${{ steps.geul.outputs.sha }}
      - name: 글 컴파일러 · PTX · SPIR-V 뒷단 빌드(파이썬 참조 구현 → 글로 쓴 컴파일러 → 뒷단 둘)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: geul-lang-v2
        env:
          PYTHONUTF8: "1"
        run: |
          mkdir -p build
          GEUL_ROOT=. python ref/geulc.py self/컴파일러.gl -o build/self_컴파일러.exe
          GEUL_ROOT=. build/self_컴파일러.exe research/gpu/자체PTX/PTX.gl -o build/자체PTX.exe
          GEUL_ROOT=. build/self_컴파일러.exe research/gpu/자체SPIRV/SPIRV.gl -o build/자체SPIRV.exe
      - name: 빠른 점검
        working-directory: GeulPUv2
        env:
          PYTHONUTF8: "1"
        run: python -X utf8 시험/빠른점검.py --글 ../geul-lang-v2 --출력 점검결과 --ptxas "$(cat ../ptxas경로.txt)"
      - name: 점검 결과 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-result
          path: GeulPUv2/점검결과/*.txt
          if-no-files-found: ignore

  linux:
    # 29단계 — 리눅스(글 D-50): 같은 고정 커밋의 글 컴파일러 · PTX 뒷단을 리눅스에서 만들고(ELF), 생성기 · 호스트 프로그램을 빌드하고,
    # 모듈을 처음부터 만들어 윈도와 같은 시험/모듈해시.txt 와 바이트까지 견준다. 가져오기는 libc.so.6 · libcuda.so.1 뿐이어야 한다.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: GeulPU 받기
        uses: actions/checkout@v7
        with:
          path: GeulPUv2
      - name: 글 저장소의 고정 커밋 읽기
        id: geul
        run: echo "sha=$(tr -d '\r\n ' < GeulPUv2/시험/글저장소커밋.txt)" >> "$GITHUB_OUTPUT"
      - name: 글 저장소 받기(research/gpu 의 고정 커밋)
        uses: actions/checkout@v7
        with:
          repository: wwoosshh/geul-lang
          ref: ${{ steps.geul.outputs.sha }}
          path: geul-lang-v2
      - name: 파이썬
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 파이썬 꾸러미(+ 검사용 ptxas)
        run: |
          python -m pip install -r GeulPUv2/requirements.txt nvidia-cuda-nvcc-cu12==12.9.86
          python -c "import importlib.util, os; p = importlib.util.find_spec('nvidia.cuda_nvcc').submodule_search_locations[0]; print(os.path.join(p, 'bin', 'ptxas'))" > ptxas경로.txt
          cat ptxas경로.txt
      - name: 글 컴파일러 · PTX · SPIR-V 뒷단 빌드(파이썬 참조 구현 → 글로 쓴 컴파일러(ELF) → 뒷단 둘(ELF))
        working-directory: geul-lang-v2
        env:
          PYTHONUTF8: "1"
        run: |
          mkdir -p build
          GEUL_ROOT=. python ref/geulc.py self/컴파일러.gl -o build/self_컴파일러
          GEUL_ROOT=. build/self_컴파일러 research/gpu/자체PTX/PTX.gl -o build/자체PTX
          GEUL_ROOT=. build/self_컴파일러 research/gpu/자체SPIRV/SPIRV.gl -o build/자체SPIRV
      - name: 빠른 점검(리눅스)
        working-directory: GeulPUv2
        env:
          PYTHONUTF8: "1"
        run: python -X utf8 시험/빠른점검.py --글 ../geul-lang-v2 --출력 점검결과 --ptxas "$(cat ../ptxas경로.txt)"
      - name: 점검 결과 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-result-linux
          path: GeulPUv2/점검결과/*.txt
          if-no-files-found: ignore
