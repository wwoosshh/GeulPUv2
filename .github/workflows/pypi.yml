# GeulPU 의 PyPI 배포(문서/배포.md) — 릴리스가 공개되면 그 릴리스에 붙은 휠(릴리스 CI 가 꾸리기 바로 뒤에 만든 것 — 공개 앞에 시험한 그
# 파일)을 받아 SHA256SUMS 와 견주고 PyPI 에 신뢰 게시(OIDC — 비밀 토큰 없음)로 올린다. 휠을 다시 만들지 않는다.
# 처음 한 번: pypi.org 의 pending publisher(프로젝트 geulpu · 소유자 wwoosshh · 저장소 GeulPUv2 · 워크플로 pypi.yml · environment pypi)를
# 등록한 뒤 저장소 변수 PYPI_READY=true — 그 앞에는 이 일을 건너뛴다(실패로 남지 않게). 손으로(workflow_dispatch) 태그를 주어 다시 돌린다.
name: PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "공개된 릴리스의 태그(v<판>)"
        required: true
jobs:
  pypi:
    if: vars.PYPI_READY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/geulpu
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 릴리스의 휠 받기 · 견주기
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "태그 꼴이 아니다: $TAG"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "geulpu-*.whl" --pattern "SHA256SUMS.txt" --dir dl
          test -f "dl/geulpu-${TAG#v}-py3-none-win_amd64.whl"
          (cd dl && sha256sum -c --ignore-missing SHA256SUMS.txt)
          mkdir dist && mv dl/*.whl dist/ && ls -l dist
      - name: PyPI 에 올리기(신뢰 게시)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
