<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>GeulPU</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <nav id="rail" aria-label="메뉴">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><path fill="currentColor" d="M14.80 30.05 L14.80 25.99 L38.84 25.99 Q39.21 20.71 39.21 18.10 L19.80 18.10 L19.80 14.08 L44.05 14.08 Q44.05 18.63 43.53 25.99 L49.20 25.99 L49.20 30.05Z M19.91 49.92 L19.91 39.50 L39.36 39.50 L39.36 36.91 L19.91 36.91 L19.91 32.89 L44.16 32.89 L44.16 43.27 L24.72 43.27 L24.72 45.92 L45.11 45.92 L45.11 49.92Z"/></svg></div>
    <button class="rail-btn" data-group="exp" data-tip="실험" aria-label="실험"></button>
    <button class="rail-btn" data-group="model" data-tip="모델" aria-label="모델"></button>
    <button class="rail-btn" data-group="repro" data-tip="재현" aria-label="재현"></button>
    <button class="rail-btn" data-group="jobs" data-tip="작업" aria-label="작업"></button>
    <div class="rail-gap"></div>
    <button class="rail-btn" data-group="settings" data-tip="설정" aria-label="설정"></button>
  </nav>
  <main id="main">
    <div id="banner" hidden role="status"></div>
    <nav id="grp" class="grp" aria-label="화면 탭" hidden></nav>

    <section id="view-exp" class="view" aria-label="실험"><div class="page" id="page-exp"></div></section>
    <section id="view-chat" class="view" aria-label="채팅">
      <div id="scrim" hidden></div>
      <aside id="convos" aria-label="채팅 목록">
        <div class="convos-head">
          <button class="btn" id="newroom" data-tip="Ctrl+Shift+O" data-tip-pos="bottom"></button>
          <button class="icon-btn" id="hide-convos" data-tip="목록 닫기" data-tip-pos="bottom" aria-label="채팅 목록 닫기"></button>
        </div>
        <div id="roomlist"></div>
        <div class="convos-foot">채팅은 이 브라우저에만 저장됩니다</div>
      </aside>
      <div id="chat">
        <header id="chat-top">
          <button class="icon-btn" id="show-convos" data-tip="채팅 목록" data-tip-pos="bottom" aria-label="채팅 목록 열기" hidden></button>
          <button class="model-pill needs-conn" id="model-pill" aria-haspopup="menu" aria-expanded="false"></button>
          <span class="model-state" id="model-state"></span>
          <button class="mode-chip needs-conn" id="mode-chip" aria-haspopup="dialog" aria-expanded="false" hidden></button>
          <span class="grow"></span>
          <button class="icon-btn" id="optbtn" data-tip="생성 설정" data-tip-pos="left" aria-label="생성 설정" aria-haspopup="dialog" aria-expanded="false"></button>
        </header>
        <div id="msgs"></div>
        <footer id="composer">
          <button class="icon-btn" id="tobottom" aria-label="맨 아래로" hidden></button>
          <div class="composer-box needs-conn">
            <textarea id="input" rows="1" placeholder="메시지 입력" aria-label="메시지"></textarea>
            <div class="composer-bar">
              <span class="hint" id="composer-hint">Enter 보내기 · Shift+Enter 줄바꿈</span>
              <span class="grow"></span>
              <button class="send-btn" id="sendbtn" aria-label="보내기" disabled></button>
            </div>
          </div>
        </footer>
      </div>
    </section>

    <section id="view-models" class="view" aria-label="모델"><div class="page" id="page-models"></div></section>
    <section id="view-eval" class="view" aria-label="모델 평가"><div class="page wide" id="page-eval"></div></section>
    <section id="view-agents" class="view" aria-label="에이전트"><div class="page" id="page-agents"></div></section>
    <section id="view-debug" class="view" aria-label="디버거"><div class="page wide" id="page-debug"></div></section>
    <section id="view-perf" class="view" aria-label="성능"><div class="page" id="page-perf"></div></section>
    <section id="view-llama" class="view" aria-label="llama.cpp"><div class="page" id="page-llama"></div></section>
    <section id="view-checks" class="view" aria-label="검사"><div class="page" id="page-checks"></div></section>
    <section id="view-results" class="view" aria-label="검사 결과"><div class="page" id="page-results"></div></section>
    <section id="view-jobs" class="view" aria-label="작업"><div class="page" id="page-jobs"></div></section>
    <section id="view-device" class="view" aria-label="장치"><div class="page" id="page-device"></div></section>
    <section id="view-settings" class="view" aria-label="설정"><div class="page" id="page-settings"></div></section>
    <section id="view-cache" class="view" aria-label="프롬프트 캐시"><div class="page" id="page-cache"></div></section>

    <footer id="statusbar" aria-label="상태"></footer>
  </main>
  <div id="c-handle" role="separator" aria-orientation="vertical" aria-label="명령 창 폭" aria-valuemin="280" aria-valuemax="640" tabindex="0"></div>
  <aside id="console" aria-label="명령 창"></aside>
</div>
<div id="modal" hidden><div class="box" id="modalbox" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div></div>
<div id="toast" aria-live="polite"></div>
<div id="sr-live" class="sr" aria-live="polite"></div>
<script src="/app.js"></script>
<script src="/eval.js"></script>
<script type="module" src="/ui/console.js"></script>
<script type="module" src="/ui/experiments.js"></script>
<script type="module" src="/ui/nav.js"></script>
<script type="module" src="/ui/jobs.js"></script>
<script type="module" src="/ui/repro.js"></script>
</body>
</html>
